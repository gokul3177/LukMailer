services:
  - type: web
    name: lukmailer
    env: python
    buildCommand: "pip install -r requirements.txt && cd frontend && npm install && npm run build && cd .."
    startCommand: "uvicorn backend.api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 8000
    autoDeploy: true
